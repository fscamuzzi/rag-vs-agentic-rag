services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: rag-qdrant
    ports:
      - "6333:6333" # REST / dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  mongodb:
    image: mongo:8
    container_name: rag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  qdrant_data:
  mongo_data:
